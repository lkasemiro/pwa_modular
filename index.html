<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria CEDAE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script> </head>
<body>
    <header class="bg-[#0C3C78] text-white p-6 rounded-b-3xl shadow-xl">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold">Supervisão Ambiental</h1>
                <p class="text-blue-200 text-xs">Vistoria de Campo</p>
            </div>
            <div class="pulse-container">
                <div class="pulse-dot"></div>
                <span class="text-[10px] font-mono">GPS ATIVO</span>
            </div>
        </div>
    </header>

    <nav class="flex px-6 mt-4 gap-4">
        <button onclick="alternarAba('formulario')" id="btn-form" class="flex-1 pb-2 border-b-4 border-[#0C3C78] font-bold text-[#0C3C78]">Nova Vistoria</button>
        <button onclick="alternarAba('historico')" id="btn-hist" class="flex-1 pb-2 border-b-4 border-transparent text-gray-400 font-bold">Histórico</button>
    </nav>

    <main class="p-6">
        <section id="aba-formulario">
            <div class="card">
                <label class="block font-bold mb-2">Local da Vistoria</label>
                <select id="select-local" onchange="capturarCoordenadas('local')" class="w-full p-3 border rounded-lg bg-gray-50">
                    <option value="">Selecione a Unidade...</option>
                    <option value="Tinguá">ETA Tinguá</option>
                </select>
                <p class="text-[10px] text-blue-600 mt-2 font-mono">Coord: <span id="coords-local">0.000, 0.000</span></p>
            </div>

            <div class="card">
                <label class="block font-bold mb-2">Sublocal (Roteiro PGE)</label>
                <select id="select-sublocal" onchange="capturarCoordenadas('sublocal')" class="w-full p-3 border rounded-lg bg-gray-50">
                    <option value="">Selecione o Ponto...</option>
                    <option value="Captação">Captação Principal</option>
                </select>
                <p class="text-[10px] text-blue-600 mt-2 font-mono">Coord: <span id="coords-sublocal">0.000, 0.000</span></p>
            </div>

            <button onclick="salvarVistoria()" class="btn-cedae shadow-lg">FINALIZAR E SALVAR</button>
        </section>

        <section id="aba-historico" class="hidden">
            <h2 class="font-bold text-gray-700 mb-4">Vistorias Salvas no Dispositivo</h2>
            <div id="lista-historico" class="space-y-3">
                </div>
        </section>
    </main>

    <script src="indexedDB.js"></script>
    <script src="app.js"></script>
</body>
</html>
