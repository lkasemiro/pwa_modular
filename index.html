<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervisão Ambiental – CEDAE</title>

  <meta name="theme-color" content="#0C3C78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CEDAE Form">
  
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 text-gray-800">

<div id="message-box"
     class="fixed top-0 left-1/2 transform -translate-x-1/2 mt-4 p-3 text-white rounded-lg shadow-lg hidden z-50"></div>

<section id="screen-cadastro" class="max-w-5xl mx-auto p-4">
  <div class="text-center mb-6">
    <img src="icon.png" alt="Logo CEDAE" class="h-20 mx-auto mb-4">
    <h1 class="text-xl font-bold text-blue-900 uppercase tracking-tight">
      Relatório de Supervisão Ambiental
    </h1>
    <p class="text-gray-600">Formulário de Visita Técnica</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <label class="block font-medium text-gray-700 mb-1">Nome do Avaliador:</label>
      <input id="avaliador" type="text" placeholder="Nome completo"
             class="w-full p-3 border border-gray-300 rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">

      <label class="block font-medium text-gray-700 mb-1">Local da Visita:</label>
      <select id="local" class="w-full p-3 border border-gray-300 rounded mb-4 focus:ring-2 focus:ring-blue-500"></select>

      <label class="block font-medium text-gray-700 mb-1">Data da Visita:</label>
      <input id="data_visita" type="date"
             class="w-full p-3 border border-gray-300 rounded mb-4">

      <label class="block font-medium text-gray-700 mb-1">Colaborador da GLA:</label>
      <input id="colaborador" type="text" placeholder="Nome do acompanhante"
             class="w-full p-3 border border-gray-300 rounded mb-6">

      <button id="btn-cadastro-continuar"
              class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-800 transition-all">
        Salvar e Continuar
      </button>
    </div>

    <div id="mapa_local"
         style="height:450px; width:100%;"
         class="rounded-xl border-2 border-white shadow-md z-10"></div>
  </div>
</section>

<div id="camera-modal"
     class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-4 w-full max-w-lg">
    <div class="flex justify-between items-center mb-4">
        <h4 class="text-lg font-bold">Capturar Foto</h4>
        <button id="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>

    <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden shadow-inner">
      <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div id="camera-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400 text-center p-4">
        <p>Aguardando permissão da câmera...</p>
      </div>
    </div>

    <div class="mt-6 flex gap-3">
      <button id="start-camera" class="bg-blue-600 text-white py-3 px-4 rounded-xl flex-1 font-semibold">
        <span id="camera-btn-text">Ativar Câmera</span>
      </button>
      <button id="capture-photo" disabled class="bg-green-600 text-white py-3 px-4 rounded-xl flex-1 font-semibold disabled:opacity-30">
        Tirar Foto
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<script src="roteiros.js"></script>
<script src="app.js"></script>
<script src="indexedDB.js"></script>


<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").then(reg => {
        console.log("SW registrado:", reg.scope);
        
        // Verifica se há uma nova versão do SW aguardando
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // Notifica o usuário que há uma nova versão disponível
              if(confirm("Nova atualização disponível! Deseja atualizar agora?")) {
                installingWorker.postMessage({ type: 'SKIP_WAITING' });
                window.location.reload();
              }
            }
          };
        };
      });
    });
  }
</script>

</body>
</html>
